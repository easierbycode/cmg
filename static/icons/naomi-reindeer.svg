<?xml version="1.0" encoding="UTF-8"?>
<!--
  The NAOMI section's launcher icon: the leaping reindeer of the Utopia
  Dreamcast Boot Disc, redrawn as a flat silhouette in the launcher's green so
  it sits inside the dashboard's round "glass" tile (see .game-icon .glass in
  static/dashboard.css, which scales it to 88% and adds the glow).

  static/icons/naomi-reindeer.png is rasterized from this file — regenerate it
  with any SVG renderer at 512x512 on a transparent background.
-->
<!-- The viewBox is cropped to the drawing's bounds (and squared) so the tile's
     object-fit: contain leaves no dead margin around the deer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -15 218 218" width="256" height="256">
  <g fill="none" stroke="#bdf48c" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antlers: a pair of sweeps back over the shoulders, three tines each. -->
    <g stroke-width="6.5">
      <path d="M182 70 C 172 46, 154 30, 128 22" />
      <path d="M172 48 C 158 44, 146 46, 134 52" />
      <path d="M160 36 C 150 28, 140 24, 128 24" />
      <path d="M148 26 C 142 18, 136 12, 128 8" />
      <path d="M192 66 C 190 42, 178 24, 158 12" />
      <path d="M188 44 C 176 38, 166 36, 154 38" />
      <path d="M176 24 C 168 16, 160 12, 150 10" />
    </g>
    <!-- Ears. -->
    <g stroke-width="5.5">
      <path d="M186 78 C 176 74, 168 74, 160 78" />
    </g>
    <!-- Legs: fore pair reaching forward, hind pair thrown back mid-leap.
         Each is one bend at the knee, hoof at the end. -->
    <g stroke-width="9.5">
      <path d="M156 124 C 174 140, 190 152, 210 156" />
      <path d="M148 130 C 158 152, 168 168, 186 178" />
      <path d="M84 128 C 62 138, 44 146, 24 144" />
      <path d="M92 136 C 82 156, 68 170, 48 178" />
    </g>
  </g>
  <!-- Body, neck and head: back line over the shoulder, up the neck, round the
       muzzle and back down the chest to the belly. -->
  <path fill="#bdf48c" d="
    M 64 118
    C 72 104, 92 96, 116 96
    C 134 96, 148 100, 158 108
    C 162 96, 170 82, 180 70
    C 184 65, 190 62, 196 63
    C 203 64, 212 70, 219 76
    C 223 80, 222 85, 216 85
    L 202 85
    C 198 94, 192 104, 184 112
    C 176 120, 164 126, 150 130
    C 132 135, 108 136, 90 133
    C 74 130, 62 126, 60 120
    Z" />
  <!-- Tail, flicked up. -->
  <path fill="#bdf48c" d="M 64 114 C 56 104, 50 96, 47 90 C 44 100, 46 114, 62 124 Z" />
  <!-- Eye, punched out of the head. -->
  <circle cx="197" cy="76" r="3.2" fill="#0a1a0e" />
</svg>
