<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sega Saturn</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #9cff6b;
        font-family: "Share Tech Mono", monospace;
      }
      #display {
        width: 100%;
        height: 100%;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      #err.show {
        display: flex;
      }
      /* Hide EmulatorJS chrome by default — parent toggles `.show-controls` to reveal */
      .ejs_menu_bar, .ejs_top_bar {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.2s ease;
      }
      body.show-controls .ejs_menu_bar,
      body.show-controls .ejs_top_bar,
      body.touch .ejs_menu_bar,
      body.touch .ejs_top_bar {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      /* Hide cursor when a gamepad is connected — except while the EmulatorJS
         Control Settings screen is up (body.settings-open): that screen is
         mouse-only, so the pointer must stay visible or it can't be driven. */
      body.pad-on:not(.settings-open),
      body.pad-on:not(.settings-open) * {
        cursor: none !important;
      }
    </style>
    <script src="/gamepad-compatibility-plugin.js"></script>
    <script src="/emulator-controls.js"></script>
    <script src="/shaders/pixellate.js"></script>
  </head>
  <body>
    <div id="display"></div>
    <div id="err">No disc specified.</div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var rom = params.get("rom") || "";
        var byod = params.get("byod") === "1";

        if (!byod && !rom) {
          document.getElementById("err").classList.add("show");
          return;
        }

        if ("ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0) {
          document.body.classList.add("touch");
        }

        // Cursor hide on gamepad connect
        function refreshPadClass() {
          var pads = (navigator.getGamepads && navigator.getGamepads()) || [];
          var any = false;
          for (var i = 0; i < pads.length; i++) {
            if (pads[i] && pads[i].connected) {
              any = true;
              break;
            }
          }
          document.body.classList.toggle("pad-on", any);
        }
        window.addEventListener("gamepadconnected", refreshPadClass);
        window.addEventListener("gamepaddisconnected", refreshPadClass);
        refreshPadClass();

        if (window.CMGGamepadCompat) {
          window.CMGGamepadCompat.install({
            sourceParent: true,
            preferSinglePad: true,
            forceIndexZero: true,
          });
        }
        refreshPadClass();

        // Default gamepad layout — the Saturn table and any per-game override
        // live in /emulator-controls.js, shared by every EmulatorJS player.
        // Applied again once the disc name is known (see boot()), so a game
        // with its own layout picks it up.
        if (window.CMGEmuControls) window.CMGEmuControls.apply("segaSaturn", "");

        // ── First controller auto-select ────────────────────────────────────
        // EmulatorJS assigns a pad to the first free player when its
        // GamepadHandler fires "connected" — but that handler polls
        // synchronously in its own constructor, so a pad that is already
        // connected when the emulator boots (the normal couch case) fires
        // before EmulatorJS subscribes and is never assigned: the player had
        // to open Control Settings and pick it by hand. Claim Player 1's slot
        // ourselves whenever it is empty or stale.
        setInterval(function () {
          try {
            var e = window.EJS_emulator;
            if (!e || !e.gamepad || !e.gamepadSelection || !e.gamepadSelection.length) return;
            var ids = [];
            for (var i = 0; i < e.gamepad.gamepads.length; i++) {
              var p = e.gamepad.gamepads[i];
              if (p) ids.push(p.id + "_" + p.index);
            }
            // Drop selections whose pad is gone, then hand the first
            // unclaimed pad to Player 1.
            for (var j = 0; j < e.gamepadSelection.length; j++) {
              if (e.gamepadSelection[j] && ids.indexOf(e.gamepadSelection[j]) < 0) {
                e.gamepadSelection[j] = "";
              }
            }
            if (!e.gamepadSelection[0]) {
              for (var k = 0; k < ids.length; k++) {
                if (e.gamepadSelection.indexOf(ids[k]) < 0) {
                  e.gamepadSelection[0] = ids[k];
                  if (e.gamepadLabels) e.updateGamepadLabels();
                  break;
                }
              }
            }
          } catch (_) {}
        }, 500);

        // Control Settings (and its bind-a-button popups) are mouse-only —
        // body.settings-open lifts the pad-on cursor hiding while any of
        // them is up (see the <style> block).
        setInterval(function () {
          var open = false;
          try {
            var e = window.EJS_emulator;
            open = !!(e &&
              ((e.controlMenu && e.controlMenu.style.display !== "none") ||
                e.currentPopup));
          } catch (_) {}
          document.body.classList.toggle("settings-open", open);
        }, 250);

        // Only accept control / file messages from our own parent (same-origin).
        function isFromOwnParent(e) {
          if (e.origin && e.origin !== window.location.origin) return false;
          return e.source === window.parent;
        }
        window.addEventListener("message", function (e) {
          if (!isFromOwnParent(e)) return;
          var d = e.data || {};
          if (d.type === "tg16-show-controls") {
            document.body.classList.add("show-controls");
          } else if (d.type === "tg16-hide-controls") {
            document.body.classList.remove("show-controls");
          }
        });

        function postParent(type) {
          try {
            window.parent.postMessage({ type: type }, window.location.origin);
          } catch (_) {}
        }

        // Keyboard fallback for the control bar — see turbografx16/play.html. The
        // ` / ~ key (Backquote, with or without Shift) and Escape mirror the SELECT + Down
        // gamepad chord, so the emulator menu (incl. Exit) is reachable when the
        // Gamepad API sees no pad (e.g. Flatpak Chrome under Steam). The iframe
        // holds focus during play, so this fires; the parent owns the toggle state.
        window.addEventListener("keydown", function (e) {
          if (
            e.code === "Backquote" || e.key === "`" || e.key === "~" ||
            e.keyCode === 192 || e.key === "Escape"
          ) {
            // Capture phase + stopImmediatePropagation so EmulatorJS (which
            // listens on document) never also acts on this key.
            e.preventDefault();
            e.stopImmediatePropagation();
            postParent("tg16-toggle-controls");
          }
        }, true);

        // First touch inside the game iframe tells the parent to drop its close
        // button + controller-legend overlay so they don't obscure play.
        var touchReported = false;
        function reportFirstTouch() {
          if (touchReported) return;
          touchReported = true;
          postParent("tg16-first-touch");
          window.removeEventListener("touchstart", reportFirstTouch, true);
          window.removeEventListener("pointerdown", reportFirstTouch, true);
        }
        window.addEventListener("touchstart", reportFirstTouch, {
          capture: true,
          passive: true,
        });
        window.addEventListener("pointerdown", reportFirstTouch, {
          capture: true,
          passive: true,
        });

        function hookExitButton() {
          var buttons = document.querySelectorAll(".ejs_menu_button");
          for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            var text = (b.textContent || "").trim();
            if (text === "Exit Emulation" && !b.dataset.saturnHooked) {
              b.dataset.saturnHooked = "1";
              b.addEventListener("click", function () {
                postParent("tg16-exit");
              });
              return true;
            }
          }
          return false;
        }

        function boot(gameUrl, title) {
          document.title = title;
          // Now that the disc is known, re-resolve the control table so a game
          // with its own entry in emulator-controls.js overrides the console
          // default. No entry -> same table as above.
          if (window.CMGEmuControls) window.CMGEmuControls.apply("segaSaturn", title);
          window.EJS_player = "#display";
          window.EJS_core = "segaSaturn";
          window.EJS_gameUrl = gameUrl;
          window.EJS_gameName = title;
          // Saturn BIOS — required by the yabause core. Region-locked; supply a
          // matching dump (US/JP/EU). MD5 af5828fdff51384f99b3c4926be27762.
          window.EJS_biosUrl = "/bios/saturn_bios.bin";
          window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
          window.EJS_startOnLoaded = true;
          window.EJS_color = "#7CFF4F";
          window.EJS_ready = function () {
            if (hookExitButton()) return;
            var mo = new MutationObserver(function () {
              if (hookExitButton()) mo.disconnect();
            });
            mo.observe(document.body, { childList: true, subtree: true });
            setTimeout(function () {
              mo.disconnect();
            }, 15000);
          };
          // OpenEmu Pixellate shader — on by default, toggled from the OSD.
          if (window.CMGPixellate) window.CMGPixellate.configure();
          var s = document.createElement("script");
          s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
          document.body.appendChild(s);
        }

        if (byod) {
          // BYOD: parent (Dashboard) sends the disc File via postMessage so
          // EmulatorJS sees a File in *this* realm. (A parent-realm File would
          // fail EmulatorJS's `instanceof File` check.) We boot only after the
          // file arrives — and we only accept the message from our own parent.
          var booted = false;
          window.addEventListener("message", function (ev) {
            if (booted) return;
            if (!isFromOwnParent(ev)) return;
            if (!ev.data || ev.data.type !== "saturn-byod-file") return;
            if (!ev.data.file) return;
            booted = true;
            var t = ev.data.name || ev.data.file.name.replace(/\.[^.]+$/, "");
            boot(ev.data.file, t);
          });
          try {
            window.parent.postMessage(
              { type: "saturn-byod-ready" },
              window.location.origin,
            );
          } catch (_) {}
          setTimeout(function () {
            if (booted) return;
            document.getElementById("err").textContent =
              "BYOD failed: parent did not deliver disc file (10s).";
            document.getElementById("err").classList.add("show");
          }, 10000);
        } else {
          var url = "/SegaSaturn/" + encodeURIComponent(rom);
          var t = rom.replace(/\.(chd|iso|bin|cue|m3u|zip)$/i, "");
          boot(url, t);
        }
      })();
    </script>
  </body>
</html>
