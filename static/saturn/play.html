<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sega Saturn</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #9cff6b;
        font-family: "Share Tech Mono", monospace;
      }
      #display {
        width: 100%;
        height: 100%;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      #err.show {
        display: flex;
      }
      /* Hide EmulatorJS chrome by default — parent toggles `.show-controls` to reveal */
      .ejs_menu_bar, .ejs_top_bar {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.2s ease;
      }
      body.show-controls .ejs_menu_bar,
      body.show-controls .ejs_top_bar,
      body.touch .ejs_menu_bar,
      body.touch .ejs_top_bar {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      /* Hide cursor when a gamepad is connected */
      body.pad-on, body.pad-on * {
        cursor: none !important;
      }
    </style>
    <script src="/gamepad-compatibility-plugin.js"></script>
    <script src="/shaders/pixellate.js"></script>
  </head>
  <body>
    <div id="display"></div>
    <div id="err">No disc specified.</div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var rom = params.get("rom") || "";
        var byod = params.get("byod") === "1";

        if (!byod && !rom) {
          document.getElementById("err").classList.add("show");
          return;
        }

        if ("ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0) {
          document.body.classList.add("touch");
        }

        // Cursor hide on gamepad connect
        function refreshPadClass() {
          var pads = (navigator.getGamepads && navigator.getGamepads()) || [];
          var any = false;
          for (var i = 0; i < pads.length; i++) {
            if (pads[i] && pads[i].connected) {
              any = true;
              break;
            }
          }
          document.body.classList.toggle("pad-on", any);
        }
        window.addEventListener("gamepadconnected", refreshPadClass);
        window.addEventListener("gamepaddisconnected", refreshPadClass);
        refreshPadClass();

        if (window.CMGGamepadCompat) {
          window.CMGGamepadCompat.install({
            sourceParent: true,
            preferSinglePad: true,
            forceIndexZero: true,
          });
        }
        refreshPadClass();

        // ── SNES gamepad (NSO SNES pad, 057e:2017) ─────────────────────────
        // The pad reports mapping "" with its face buttons in Nintendo HID
        // order — B=0, A=1, Y=2, X=3, L=4, R=5, Select=8, Start=9 — and the
        // D-pad as an encoded hat on axes[9] (which CMGGamepadCompat rewrites
        // to standard D-pad buttons 12-15). EmulatorJS labels gamepad buttons
        // purely by index (0→BUTTON_1, 1→BUTTON_2, 2→BUTTON_3, 3→BUTTON_4,
        // 4→LEFT_TOP_SHOULDER, 5→RIGHT_TOP_SHOULDER, 8→SELECT, 9→START), so
        // its stock defaults — written for Xbox-labeled standard pads — land
        // A/B and X/Y swapped positionally on this pad.
        //
        // When an SNES pad is detected, install the RetroArch-canonical
        // mapping instead (RetroPad naming IS the SNES layout, and the
        // yabause core assigns RetroPad→Saturn as B→A, A→B, R→C, Y→X, X→Y,
        // L→Z, L2→L, R2→R):
        //
        //   Saturn A ← SNES B (bottom)   Saturn X ← SNES Y (left)
        //   Saturn B ← SNES A (right)    Saturn Y ← SNES X (top)
        //   Saturn C ← SNES R            Saturn Z ← SNES L
        //
        // i.e. Saturn's bottom row A/B/C sits on B/A/R and its top row X/Y/Z
        // on Y/X/L. The Saturn L/R triggers (controls 12/13) keep only their
        // keyboard bindings — the SNES pad has no buttons left for them.
        // Keyboard values mirror the EmulatorJS defaults so keys are
        // unchanged.
        var SNES_PAD_RE =
          /SNES Controller|Nintendo.*SNES|057e.{0,8}2017/i;

        function snesPadPresent() {
          var pads = (navigator.getGamepads && navigator.getGamepads()) || [];
          for (var i = 0; i < pads.length; i++) {
            if (pads[i] && pads[i].connected && SNES_PAD_RE.test(pads[i].id || "")) {
              return true;
            }
          }
          return false;
        }

        function snesSaturnControls() {
          return {
            0: {
              0: { value: "x", value2: "BUTTON_1" }, // Saturn A ← SNES B
              1: { value: "s", value2: "BUTTON_3" }, // Saturn X ← SNES Y
              2: { value: "v", value2: "SELECT" },
              3: { value: "enter", value2: "START" },
              4: { value: "up arrow", value2: "DPAD_UP" },
              5: { value: "down arrow", value2: "DPAD_DOWN" },
              6: { value: "left arrow", value2: "DPAD_LEFT" },
              7: { value: "right arrow", value2: "DPAD_RIGHT" },
              8: { value: "z", value2: "BUTTON_2" }, // Saturn B ← SNES A
              9: { value: "a", value2: "BUTTON_4" }, // Saturn Y ← SNES X
              10: { value: "q", value2: "LEFT_TOP_SHOULDER" }, // Saturn Z ← SNES L
              11: { value: "e", value2: "RIGHT_TOP_SHOULDER" }, // Saturn C ← SNES R
              12: { value: "tab" }, // Saturn L — keyboard only
              13: { value: "r" }, // Saturn R — keyboard only
            },
            1: {},
            2: {},
            3: {},
          };
        }

        function applySnesControls() {
          // Pre-boot: seed EmulatorJS defaults. Post-boot: patch the live
          // control table (EmulatorJS resolves value2 labels per input event,
          // so an in-place update takes effect immediately).
          window.EJS_defaultControls = snesSaturnControls();
          try {
            var e = window.EJS_emulator;
            if (!e || !e.controls || !e.controls[0]) return;
            var mine = snesSaturnControls()[0];
            for (var k in mine) {
              e.controls[0][k] = Object.assign(
                {},
                e.controls[0][k] || {},
                mine[k],
              );
            }
            if (typeof e.setupKeys === "function") e.setupKeys();
          } catch (_) {}
        }

        if (snesPadPresent()) applySnesControls();
        window.addEventListener("gamepadconnected", function () {
          if (snesPadPresent()) applySnesControls();
        });

        // Only accept control / file messages from our own parent (same-origin).
        function isFromOwnParent(e) {
          if (e.origin && e.origin !== window.location.origin) return false;
          return e.source === window.parent;
        }
        window.addEventListener("message", function (e) {
          if (!isFromOwnParent(e)) return;
          var d = e.data || {};
          if (d.type === "tg16-show-controls") {
            document.body.classList.add("show-controls");
          } else if (d.type === "tg16-hide-controls") {
            document.body.classList.remove("show-controls");
          }
        });

        function postParent(type) {
          try {
            window.parent.postMessage({ type: type }, window.location.origin);
          } catch (_) {}
        }

        // Keyboard fallback for the control bar — see turbografx16/play.html. The
        // ` / ~ key (Backquote, with or without Shift) and Escape mirror the SELECT + Down
        // gamepad chord, so the emulator menu (incl. Exit) is reachable when the
        // Gamepad API sees no pad (e.g. Flatpak Chrome under Steam). The iframe
        // holds focus during play, so this fires; the parent owns the toggle state.
        window.addEventListener("keydown", function (e) {
          if (
            e.code === "Backquote" || e.key === "`" || e.key === "~" ||
            e.keyCode === 192 || e.key === "Escape"
          ) {
            // Capture phase + stopImmediatePropagation so EmulatorJS (which
            // listens on document) never also acts on this key.
            e.preventDefault();
            e.stopImmediatePropagation();
            postParent("tg16-toggle-controls");
          }
        }, true);

        // First touch inside the game iframe tells the parent to drop its close
        // button + controller-legend overlay so they don't obscure play.
        var touchReported = false;
        function reportFirstTouch() {
          if (touchReported) return;
          touchReported = true;
          postParent("tg16-first-touch");
          window.removeEventListener("touchstart", reportFirstTouch, true);
          window.removeEventListener("pointerdown", reportFirstTouch, true);
        }
        window.addEventListener("touchstart", reportFirstTouch, {
          capture: true,
          passive: true,
        });
        window.addEventListener("pointerdown", reportFirstTouch, {
          capture: true,
          passive: true,
        });

        function hookExitButton() {
          var buttons = document.querySelectorAll(".ejs_menu_button");
          for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            var text = (b.textContent || "").trim();
            if (text === "Exit Emulation" && !b.dataset.saturnHooked) {
              b.dataset.saturnHooked = "1";
              b.addEventListener("click", function () {
                postParent("tg16-exit");
              });
              return true;
            }
          }
          return false;
        }

        function boot(gameUrl, title) {
          document.title = title;
          window.EJS_player = "#display";
          window.EJS_core = "segaSaturn";
          window.EJS_gameUrl = gameUrl;
          window.EJS_gameName = title;
          // Saturn BIOS — required by the yabause core. Region-locked; supply a
          // matching dump (US/JP/EU). MD5 af5828fdff51384f99b3c4926be27762.
          window.EJS_biosUrl = "/bios/saturn_bios.bin";
          window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
          window.EJS_startOnLoaded = true;
          window.EJS_color = "#7CFF4F";
          window.EJS_ready = function () {
            if (hookExitButton()) return;
            var mo = new MutationObserver(function () {
              if (hookExitButton()) mo.disconnect();
            });
            mo.observe(document.body, { childList: true, subtree: true });
            setTimeout(function () {
              mo.disconnect();
            }, 15000);
          };
          // OpenEmu Pixellate shader — on by default, toggled from the OSD.
          if (window.CMGPixellate) window.CMGPixellate.configure();
          var s = document.createElement("script");
          s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
          document.body.appendChild(s);
        }

        if (byod) {
          // BYOD: parent (Dashboard) sends the disc File via postMessage so
          // EmulatorJS sees a File in *this* realm. (A parent-realm File would
          // fail EmulatorJS's `instanceof File` check.) We boot only after the
          // file arrives — and we only accept the message from our own parent.
          var booted = false;
          window.addEventListener("message", function (ev) {
            if (booted) return;
            if (!isFromOwnParent(ev)) return;
            if (!ev.data || ev.data.type !== "saturn-byod-file") return;
            if (!ev.data.file) return;
            booted = true;
            var t = ev.data.name || ev.data.file.name.replace(/\.[^.]+$/, "");
            boot(ev.data.file, t);
          });
          try {
            window.parent.postMessage(
              { type: "saturn-byod-ready" },
              window.location.origin,
            );
          } catch (_) {}
          setTimeout(function () {
            if (booted) return;
            document.getElementById("err").textContent =
              "BYOD failed: parent did not deliver disc file (10s).";
            document.getElementById("err").classList.add("show");
          }, 10000);
        } else {
          var url = "/SegaSaturn/" + encodeURIComponent(rom);
          var t = rom.replace(/\.(chd|iso|bin|cue|m3u|zip)$/i, "");
          boot(url, t);
        }
      })();
    </script>
  </body>
</html>
