<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Arcade</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #9cff6b;
        font-family: "Share Tech Mono", monospace;
      }
      #emu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Emularity wraps the canvas in its own container; keep everything black
         and let the canvas scale to fit. */
      #emu canvas {
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
        background: #000;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      #err.show { display: flex; }
      body.pad-on, body.pad-on * { cursor: none !important; }
    </style>
  </head>
  <body>
    <div id="emu"><canvas id="canvas"></canvas></div>
    <div id="err">No game specified.</div>
    <script src="/arcade/emularity/browserfs.min.js"></script>
    <script src="/arcade/emularity/loader.js"></script>
    <script src="/gamepad-compatibility-plugin.js"></script>
    <script>
      (function () {
        "use strict";
        // Internet Archive emulation engine — hosts the MAME WASM cores and a
        // per-game JSON recipe (driver, core filenames, native resolution).
        // AppImage builds mirror these under ENGINE_LOCAL; browser/deploy builds
        // fall back to ENGINE_REMOTE.
        var ENGINE_LOCAL = "/arcade/emularity/engine/";
        var ENGINE_REMOTE = "https://emularity-engine.ux-b.archive.org/";

        var params = new URLSearchParams(location.search);
        var rom = params.get("rom") || "";
        var byob = params.get("byob") === "1";
        var canvas = document.getElementById("canvas");
        var errEl = document.getElementById("err");

        function fail(msg) {
          errEl.textContent = msg;
          errEl.classList.add("show");
          try { console.error("[arcade] " + msg); } catch (_) {}
        }

        if (!byob && !rom) { fail("No game specified."); return; }
        if (!window.Emulator || !window.MAMELoader) {
          fail("Emularity loader failed to load.");
          return;
        }

        if (window.CMGGamepadCompat) {
          window.CMGGamepadCompat.install({
            sourceParent: true,
            preferSinglePad: true,
            forceIndexZero: true,
          });
        }

        // Cursor hide when a gamepad is driving (parent owns the pad).
        function anyParentPad() {
          try {
            var pp = window.parent;
            if (pp && pp !== window && pp.navigator && pp.navigator.getGamepads) {
              var pg = pp.navigator.getGamepads() || [];
              for (var i = 0; i < pg.length; i++) if (pg[i] && pg[i].connected) return true;
            }
          } catch (_) {}
          return false;
        }
        setInterval(function () {
          document.body.classList.toggle("pad-on", anyParentPad());
        }, 1000);

        // ── Quick save / quick load on Share and Home ──────────────────────
        // MAME has no one-press quicksave: UI_SAVE_STATE / UI_LOAD_STATE open a
        // prompt ("Press a key or joystick button, or select state to
        // overwrite") and name the slot after whatever is pressed next. Left to
        // the player that is two presses, and save and load would land on
        // different slot names. So the gesture lives here instead: the pad
        // button is watched in JS, and both steps are driven as keystrokes —
        // MAME's stock keyboard bindings (Shift+F7 save, F7 load) followed by a
        // fixed slot key. One tap, always the same slot, both ways.
        //
        // Nothing is bound to these pad buttons in MAME's cfg on purpose: if
        // they were, MAME's own prompt could grab the button press as the slot
        // name and beat us to it.
        //
        // Save states are session-scoped (the emulator's filesystem is
        // in-memory) and MAME warns they are "not officially supported" on
        // Capcom ZN boards — they do restore correctly on sfex2, verified
        // save → advance → load.
        var QS_SAVE_BTN = 8;  // Share / Select / Create / View
        var QS_LOAD_BTN = 16; // Home / Guide / PS / Stadia (absent on many pads)
        var QS_SLOT = { code: "Digit0", key: "0", keyCode: 48 };
        var QS_TAP_MS = 500;

        function qsKey(code, key, keyCode, type, shift) {
          var ev = new KeyboardEvent(type, {
            code: code, key: key, bubbles: true, cancelable: true, shiftKey: !!shift,
          });
          // MAME reads keyCode/which; KeyboardEvent init doesn't set them.
          Object.defineProperty(ev, "keyCode", { get: function () { return keyCode; } });
          Object.defineProperty(ev, "which", { get: function () { return keyCode; } });
          (canvas || document.body).dispatchEvent(ev);
        }

        function qsRun(shift) {
          // Shift is a real key to MAME's SDL layer, so hold it around F7 the
          // way a keyboard would, then answer the slot prompt.
          if (shift) qsKey("ShiftLeft", "Shift", 16, "keydown", true);
          setTimeout(function () { qsKey("F7", "F7", 118, "keydown", shift); }, shift ? 60 : 0);
          setTimeout(function () { qsKey("F7", "F7", 118, "keyup", shift); }, shift ? 140 : 80);
          if (shift) setTimeout(function () { qsKey("ShiftLeft", "Shift", 16, "keyup", false); }, 200);
          setTimeout(function () {
            qsKey(QS_SLOT.code, QS_SLOT.key, QS_SLOT.keyCode, "keydown", false);
            setTimeout(function () {
              qsKey(QS_SLOT.code, QS_SLOT.key, QS_SLOT.keyCode, "keyup", false);
            }, 60);
          }, 400);
        }

        // Tap = pressed and released inside QS_TAP_MS with no other button
        // touched meanwhile. That keeps Share free for the launcher's
        // SELECT + Down chord (which opens the OSD): holding Share to reach the
        // OSD is not a tap, so it never fires a save.
        var qsWatch = {};
        qsWatch[QS_SAVE_BTN] = { down: 0, dirty: false, shift: true };
        qsWatch[QS_LOAD_BTN] = { down: 0, dirty: false, shift: false };

        function qsPoll() {
          var pads = (navigator.getGamepads && navigator.getGamepads()) || [];
          var pad = null;
          for (var i = 0; i < pads.length; i++) {
            if (pads[i] && pads[i].connected) { pad = pads[i]; break; }
          }
          if (!pad) return;
          var osdOpen = false;
          try {
            osdOpen = !!(window.parent && window.parent !== window &&
              window.parent.document.body.classList.contains("osd-open"));
          } catch (_) {}
          var anyOther = false;
          for (var b = 0; b < pad.buttons.length; b++) {
            if (b === QS_SAVE_BTN || b === QS_LOAD_BTN) continue;
            if (pad.buttons[b] && pad.buttons[b].pressed) { anyOther = true; break; }
          }
          for (var key in qsWatch) {
            var idx = Number(key);
            var w = qsWatch[key];
            var pressed = !!(pad.buttons[idx] && pad.buttons[idx].pressed);
            if (pressed) {
              if (!w.down) { w.down = Date.now(); w.dirty = osdOpen; }
              if (anyOther || osdOpen) w.dirty = true;
            } else if (w.down) {
              var held = Date.now() - w.down;
              w.down = 0;
              if (!w.dirty && held < QS_TAP_MS) qsRun(w.shift);
              w.dirty = false;
            }
          }
        }
        setInterval(qsPoll, 50);

        function postParent(type) {
          try { window.parent.postMessage({ type: type }, window.location.origin); } catch (_) {}
        }
        function isFromOwnParent(e) {
          if (e.origin && e.origin !== window.location.origin) return false;
          return e.source === window.parent;
        }
        // Backquote mirrors the SELECT+Down OSD chord (so Exit is reachable from
        // a keyboard) — same convention as the PSX/TG16/PS2 players.
        window.addEventListener("keydown", function (e) {
          if (e.code === "Backquote" || e.key === "`" || e.key === "~" || e.keyCode === 192) {
            e.preventDefault();
            e.stopImmediatePropagation();
            postParent("tg16-toggle-controls");
          }
        }, true);

        if (!self.crossOriginIsolated) {
          // mamezn may use SharedArrayBuffer; warn but still try.
          try { console.warn("[arcade] not cross-origin isolated"); } catch (_) {}
        }

        function basename(p) {
          return String(p || "").split(/[\\/]/).pop() || "";
        }

        function shortName(p) {
          return basename(p).replace(/\.zip$/i, "");
        }

        function readFileData(file) {
          if (file && file.arrayBuffer) return file.arrayBuffer();
          return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = function () { reject(reader.error || new Error("file read failed")); };
            reader.readAsArrayBuffer(file);
          });
        }

        function localCoreName(file) {
          return String(file || "").replace(/\.gz$/i, "");
        }

        function getRecipe(name) {
          var local = ENGINE_LOCAL + encodeURIComponent(name) + ".json";
          return fetch(local, { cache: "no-store" })
            .then(function (r) {
              if (!r.ok) throw new Error("local miss");
              return r.json().then(function (cfg) {
                cfg.__cmgEngineBase = ENGINE_LOCAL;
                return cfg;
              });
            })
            .catch(function () {
              return fetch(ENGINE_REMOTE + encodeURIComponent(name) + ".json")
                .then(function (r) {
                  if (!r.ok) throw new Error("no engine recipe for '" + name + "' (HTTP " + r.status + ")");
                  return r.json().then(function (cfg) {
                    cfg.__cmgEngineBase = ENGINE_REMOTE;
                    return cfg;
                  });
                });
            });
        }

        function resolveCoreUrl(cfg, file) {
          if (cfg.__cmgEngineBase === ENGINE_LOCAL) {
            return ENGINE_LOCAL + encodeURIComponent(localCoreName(file));
          }
          return ENGINE_REMOTE + encodeURIComponent(file);
        }

        // Config files are fetched here (no-store) and mounted as local data
        // rather than handed to the loader as a URL: the loader's own fetch is a
        // plain XHR through the HTTP cache, which can feed MAME a control map
        // older than the one the app ships.
        function resolveCfg(name) {
          if (!name) return Promise.resolve(null);
          var url = "/arcade/cfg/" + encodeURIComponent(name) + ".cfg";
          return fetch(url, { cache: "no-store" })
            .then(function (r) { return r.ok ? r.arrayBuffer() : null; })
            .then(function (data) { return data ? { name: name, data: data } : null; })
            .catch(function () { return null; });
        }

        // FNV-1a over the bytes we ship, used as the emularity filesystem key.
        //
        // The emulator's OverlayFS mirrors every write into IndexedDB, and on
        // the next boot a file that already exists there SHADOWS the one we
        // mount (loader.js sets file.cached from deltaFS.existsSync, then skips
        // the write). MAME rewrites <driver>.cfg whenever a machine stops, so
        // the very first run's control map would otherwise outlive every update
        // we ship — verified: an edited sfex2.cfg kept applying its old L3
        // binding until that store was dropped by hand. Worse, the store name
        // was a single shared "emularity" for the whole library.
        //
        // Keying the store by the config bytes gives each game its own store and
        // makes a shipped cfg/NVRAM change start a fresh one, so new defaults
        // reach players who already ran the game. A player's own writes still
        // persist for as long as the shipped files stay put.
        function stampBytes(h, buf) {
          var v = new Uint8Array(buf);
          for (var i = 0; i < v.length; i++) {
            h ^= v[i];
            h = (h * 16777619) >>> 0;
          }
          return h;
        }

        // Pre-baked NVRAM (e.g. the ZN-2 at28c16 EEPROM holding sfex2's
        // "Free Play" soft-dip) — served from /arcade/nvram/<driver>/<file>
        // and mounted where -nvram_directory points so the board boots
        // already configured. Soft dips live in NVRAM, not MAME cfg, and the
        // in-memory BrowserFS forgets everything on exit, so shipping the
        // file is the only way settings survive to a first boot.
        var NVRAM_FILES = ["at28c16"];
        function resolveNvram(driver) {
          return Promise.all(NVRAM_FILES.map(function (f) {
            var url = "/arcade/nvram/" + encodeURIComponent(driver) + "/" +
              encodeURIComponent(f);
            return fetch(url, { cache: "no-store" })
              .then(function (r) { return r.ok ? r.arrayBuffer() : null; })
              .then(function (data) { return data ? { file: f, data: data } : null; })
              .catch(function () { return null; });
          })).then(function (found) {
            return found.filter(Boolean);
          });
        }

        function startArcade(romName, localRomData) {
          var romZip = "/arcade/" + encodeURIComponent(romName) + ".zip";

          // Fetch the per-game recipe (driver, core, native resolution) from the
          // engine, then drive the MAME core. This keeps the player generic — any
          // arcade game with an engine recipe + a local ROM zip works.
          return getRecipe(romName)
            .then(function (cfg) {
              var nr = cfg.native_resolution || [640, 480];
              var wasmjs = cfg.wasmjs_filename || "mamezn.js.gz";
              var wasm = cfg.wasm_filename || "mamezn.wasm.gz";
              var driver = cfg.driver || romName;
              document.title = (cfg.name || romName) + " — Arcade";

            return Promise.all([
              resolveCoreUrl(cfg, wasmjs),
              resolveCoreUrl(cfg, wasm),
              resolveCfg("default"),
              resolveCfg(driver),
              driver === romName ? Promise.resolve(null) : resolveCfg(romName),
              resolveNvram(driver),
            ]).then(function (resolved) {
              return {
                cfg: cfg,
                nr: nr,
                wasmjsUrl: resolved[0],
                wasmUrl: resolved[1],
                defaultCfg: resolved[2],
                gameCfg: resolved[3] || resolved[4],
                nvram: resolved[5],
                driver: driver,
              };
            });
          })
          .then(function (boot) {
            var cfg = boot.cfg;
            var nr = boot.nr;
            var driver = boot.driver;
            var romSource = localRomData !== null && typeof localRomData !== "undefined"
              ? MAMELoader.localFile(cfg.name || romName, localRomData)
              : MAMELoader.fetchFile(cfg.name || romName, romZip);

            var args = [
              MAMELoader.driver(driver),
              MAMELoader.nativeResolution(nr[0], nr[1]),
              MAMELoader.scale(2),
              MAMELoader.emulatorJS(boot.wasmjsUrl),
              MAMELoader.emulatorWASM(boot.wasmUrl),
              MAMELoader.mountFile(
                "/" + romName + ".zip",
                romSource,
              ),
            ];
            var stamp = 2166136261;
            if (boot.defaultCfg) {
              stamp = stampBytes(stamp, boot.defaultCfg.data);
              args.push(MAMELoader.mountFile(
                "/default.cfg",
                MAMELoader.localFile("MAME default cfg", boot.defaultCfg.data),
              ));
            }
            if (boot.gameCfg) {
              stamp = stampBytes(stamp, boot.gameCfg.data);
              args.push(MAMELoader.mountFile(
                "/" + driver + ".cfg",
                MAMELoader.localFile("MAME game cfg", boot.gameCfg.data),
              ));
            }
            (boot.nvram || []).forEach(function (nv) {
              stamp = stampBytes(stamp, nv.data);
              args.push(MAMELoader.mountFile(
                "/nvram/" + driver + "/" + nv.file,
                MAMELoader.localFile("MAME nvram " + nv.file, nv.data),
              ));
            });
            // BYOD boards get a throwaway store (the zip isn't ours to key on);
            // library games get one per driver, invalidated by the config bytes.
            args.push(MAMELoader.fileSystemKey(
              localRomData !== null && typeof localRomData !== "undefined"
                ? "arcade-byob-" + romName + "-" + Date.now()
                : "arcade-" + driver + "-" + stamp.toString(36),
            ));
            // BIOS / device ROM sets (e.g. coh3002c for ZN-2, qsound). MAME finds
            // any ROM set mounted into the rompath, so split sets work as long as
            // their BIOS zips are dropped into static/arcade/ and named here via
            // ?bios=coh3002c,qsound (the dashboard passes this per game).
            var biosSets = (params.get("bios") || cfg.bios_zip || "")
              .split(",").map(function (s) { return s.trim(); }).filter(Boolean);
            biosSets.forEach(function (b) {
              args.push(MAMELoader.mountFile(
                "/" + b + ".zip",
                MAMELoader.fetchFile(b, "/arcade/" + encodeURIComponent(b) + ".zip"),
              ));
            });
            // Extra MAME args: point MAME's config/NVRAM lookups at the
            // BrowserFS mount. Emularity mounts every mountFile() under
            // /emulator, but MAME's cfg_directory defaults to /cfg and
            // nvram_directory to /nvram — so the shipped <driver>.cfg
            // control maps were never read (verified against MAME 0.239's
            // Input menu: it showed stock defaults until this flag). Then
            // the recipe's extra_args, plus optional overrides for
            // debugging the renderer — ?video=opengl|bgfx|accel|soft and
            // ?args=<space-separated MAME flags>.
            var extra = [
              "-cfg_directory", "/emulator",
              "-nvram_directory", "/emulator/nvram",
            ];
            if (cfg.extra_args && cfg.extra_args.join("")) extra = extra.concat(cfg.extra_args);
            var video = params.get("video");
            if (video) extra.push("-video", video);
            var moreArgs = params.get("args");
            if (moreArgs) extra = extra.concat(moreArgs.split(" ").filter(Boolean));
            if (extra.length) args.push(MAMELoader.extraArgs(extra));

            var emulator = new Emulator(canvas, null, MAMELoader.apply(null, args));
            return emulator.start();
          })
          .catch(function (e) {
            fail("Failed to start arcade game: " + (e && e.message ? e.message : e));
          });
        }

        if (byob) {
          var booted = false;
          window.addEventListener("message", function (ev) {
            if (booted) return;
            if (!isFromOwnParent(ev)) return;
            if (!ev.data || ev.data.type !== "arcade-byob-file") return;
            if (!ev.data.file) return;
            booted = true;
            var name = ev.data.name || shortName(ev.data.file.name).toLowerCase();
            readFileData(ev.data.file)
              .then(function (data) {
                return startArcade(String(name || "").toLowerCase(), data);
              })
              .catch(function (e) {
                fail("BYOB failed: " + (e && e.message ? e.message : e));
              });
          });
          try {
            window.parent.postMessage(
              { type: "arcade-byob-ready" },
              window.location.origin,
            );
          } catch (_) {}
          setTimeout(function () {
            if (booted) return;
            fail("BYOB failed: parent did not deliver board zip (10s).");
          }, 10000);
        } else {
          startArcade(shortName(rom), null);
        }
      })();
    </script>
  </body>
</html>
