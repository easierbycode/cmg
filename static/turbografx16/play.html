<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TurboGrafx-16</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; color: #9CFF6B; font-family: 'Share Tech Mono', monospace; }
  #display { width: 100%; height: 100%; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 2em; }
  #err.show { display: flex; }
  /* Hide EmulatorJS chrome by default — parent toggles `.show-controls` to reveal */
  .ejs_menu_bar, .ejs_top_bar { opacity: 0 !important; pointer-events: none !important; transition: opacity .2s ease; }
  body.show-controls .ejs_menu_bar,
  body.show-controls .ejs_top_bar,
  body.touch .ejs_menu_bar,
  body.touch .ejs_top_bar { opacity: 1 !important; pointer-events: auto !important; }
</style>
</head>
<body>
<div id="display"></div>
<div id="err">No ROM specified. Pass <code>?rom=&lt;filename&gt;</code>.</div>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var rom = params.get('rom') || '';
    if (!rom) {
      document.getElementById('err').classList.add('show');
      return;
    }
    var romUrl = '/TurboGrafx-16/' + encodeURIComponent(rom);
    var title = rom.replace(/\.pce$/i, '');
    document.title = title || 'TurboGrafx-16';

    if ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0) {
      document.body.classList.add('touch');
    }

    window.EJS_player = '#display';
    // Full Beetle PCE / Mednafen PCE libretro core (more accurate than pce_fast).
    window.EJS_core = 'mednafen_pce';
    window.EJS_gameUrl = romUrl;
    window.EJS_gameName = title;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#7CFF4F';

    function postParent(type) {
      try { window.parent.postMessage({ type: type }, '*'); } catch (_) {}
    }

    // Attach a parent-notify listener to the "Exit Emulation" menu button.
    // EmulatorJS doesn't expose an exit() method, so we hook the DOM button.
    function hookExitButton() {
      var buttons = document.querySelectorAll('.ejs_menu_button');
      for (var i = 0; i < buttons.length; i++) {
        var b = buttons[i];
        var text = (b.textContent || '').trim();
        if (text === 'Exit Emulation' && !b.dataset.tg16Hooked) {
          b.dataset.tg16Hooked = '1';
          b.addEventListener('click', function () { postParent('tg16-exit'); });
          return true;
        }
      }
      return false;
    }
    window.EJS_ready = function () {
      if (hookExitButton()) return;
      // Button may render slightly after EJS_ready — observe until it appears.
      var mo = new MutationObserver(function () {
        if (hookExitButton()) mo.disconnect();
      });
      mo.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { mo.disconnect(); }, 15000);
    };

    // Parent controls EJS chrome visibility (gamepad combo / touch).
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type === 'tg16-show-controls') document.body.classList.add('show-controls');
      else if (d.type === 'tg16-hide-controls') document.body.classList.remove('show-controls');
    });

    // Nintendo Online SNES Controller (Vendor 057e Product 2017) reports its
    // D-pad on axes[9] as a hat switch instead of on standard DPAD_* buttons.
    // When one is connected, override EmulatorJS's default D-pad mapping so
    // the user doesn't have to configure each button manually every time.
    var SNES_RE = /SNES Controller|057e.{0,8}2017/i;
    function hasSnesPad() {
      try {
        var pads = navigator.getGamepads && navigator.getGamepads();
        if (!pads) return false;
        for (var i = 0; i < pads.length; i++) {
          var p = pads[i];
          if (p && p.connected && SNES_RE.test(p.id || '')) return true;
        }
      } catch (_) {}
      return false;
    }
    function snesDefaultControls() {
      // Same layout as EmulatorJS's built-in defaultControllers, but D-pad
      // (retropad indices 4-7) is routed through EXTRA_STICK_9 so the SNES
      // hat axis is recognized as up/down/left/right.
      return {
        0: {
          0:  { value: 'x',          value2: 'BUTTON_2' },
          1:  { value: 's',          value2: 'BUTTON_4' },
          2:  { value: 'v',          value2: 'SELECT' },
          3:  { value: 'enter',      value2: 'START' },
          4:  { value: 'up arrow',    value2: 'EXTRA_STICK_9:-1' },
          5:  { value: 'down arrow',  value2: 'EXTRA_STICK_9:+1' },
          6:  { value: 'left arrow',  value2: 'EXTRA_STICK_9:+1' },
          7:  { value: 'right arrow', value2: 'EXTRA_STICK_9:+1' },
          8:  { value: 'z',          value2: 'BUTTON_1' },
          9:  { value: 'a',          value2: 'BUTTON_3' },
          10: { value: 'q',          value2: 'LEFT_TOP_SHOULDER' },
          11: { value: 'e',          value2: 'RIGHT_TOP_SHOULDER' },
          12: { value: 'tab',        value2: 'LEFT_BOTTOM_SHOULDER' },
          13: { value: 'r',          value2: 'RIGHT_BOTTOM_SHOULDER' },
          14: { value: '',           value2: 'LEFT_STICK' },
          15: { value: '',           value2: 'RIGHT_STICK' },
          16: { value: 'h',          value2: 'LEFT_STICK_X:+1' },
          17: { value: 'f',          value2: 'LEFT_STICK_X:-1' },
          18: { value: 'g',          value2: 'LEFT_STICK_Y:+1' },
          19: { value: 't',          value2: 'LEFT_STICK_Y:-1' },
          20: { value: 'l',          value2: 'RIGHT_STICK_X:+1' },
          21: { value: 'j',          value2: 'RIGHT_STICK_X:-1' },
          22: { value: 'k',          value2: 'RIGHT_STICK_Y:+1' },
          23: { value: 'i',          value2: 'RIGHT_STICK_Y:-1' },
          24: { value: '1' },
          25: { value: '2' },
          26: { value: '3' }
        },
        1: {}, 2: {}, 3: {}
      };
    }

    function loadLoader() {
      if (hasSnesPad() && !window.EJS_defaultControls) {
        window.EJS_defaultControls = snesDefaultControls();
        try { console.log('[tg16] SNES controller detected — applying SNES default controls'); } catch (_) {}
      }
      var s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(s);
    }

    if (hasSnesPad()) {
      loadLoader();
    } else {
      // Wait briefly for `gamepadconnected` in case the browser hasn't surfaced
      // the pad yet (e.g. needs a user gesture). Falls back to loading after
      // 250ms with whatever's connected by then.
      var loaded = false;
      var fire = function () { if (loaded) return; loaded = true; loadLoader(); };
      window.addEventListener('gamepadconnected', function () { setTimeout(fire, 50); });
      setTimeout(fire, 250);
    }
  })();
</script>
</body>
</html>
