<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TurboGrafx-16</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #9cff6b;
        font-family: "Share Tech Mono", monospace;
      }
      #display {
        width: 100%;
        height: 100%;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      #err.show {
        display: flex;
      }
      /* Hide EmulatorJS chrome by default — parent toggles `.show-controls` to reveal */
      .ejs_menu_bar, .ejs_top_bar {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.2s ease;
      }
      body.show-controls .ejs_menu_bar,
      body.show-controls .ejs_top_bar,
      body.touch .ejs_menu_bar,
      body.touch .ejs_top_bar {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* ── Custom touch controller ──────────────────────────────────────
         Replaces EmulatorJS's stock on-screen D-pad. The left half of the
         screen is a dynamic analog that pops up wherever the player first
         touches (mapped to the TG16 D-pad); the right half is split into two
         25% columns whose full height is the II and I button hit-boxes. */
      /* Suppress EmulatorJS's own virtual gamepad — we draw our own. */
      [class*="vgamepad"], [class*="virtualGamepad"] {
        display: none !important;
      }
      #vc-overlay {
        display: none;
      }
      body.touch #vc-overlay {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 60;
        pointer-events: none;
      }
      #vc-analog, #vc-b, #vc-a {
        position: fixed;
        top: 0;
        bottom: 0;
        pointer-events: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* While the EmulatorJS menu is up, let touches fall through to it. */
      body.show-controls #vc-analog,
      body.show-controls #vc-b,
      body.show-controls #vc-a {
        pointer-events: none;
      }
      #vc-analog { left: 0; width: 50%; }
      #vc-b { left: 50%; width: 25%; }
      #vc-a { left: 75%; width: 25%; }
      /* Face-button cue — the whole column is the hit-box; this is just a
         visual hint that doesn't intercept touches itself. */
      .vc-face {
        position: absolute;
        left: 50%;
        bottom: 16%;
        transform: translateX(-50%);
        width: 88px;
        height: 88px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 34px "Share Tech Mono", monospace;
        color: #7cff4f;
        background: rgba(124, 255, 79, 0.08);
        border: 2px solid rgba(124, 255, 79, 0.5);
        box-shadow: 0 0 12px rgba(124, 255, 79, 0.25);
        pointer-events: none;
      }
      .vc-face.active {
        background: rgba(124, 255, 79, 0.35);
        border-color: #7cff4f;
      }
      /* Dynamic analog base + knob, positioned at the touch point. */
      #vc-base, #vc-knob {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        display: none;
        z-index: 61;
      }
      #vc-base {
        width: 132px;
        height: 132px;
        margin-left: -66px;
        margin-top: -66px;
        border: 2px solid rgba(124, 255, 79, 0.4);
        background: rgba(124, 255, 79, 0.06);
      }
      #vc-knob {
        width: 60px;
        height: 60px;
        margin-left: -30px;
        margin-top: -30px;
        border: 2px solid #7cff4f;
        background: rgba(124, 255, 79, 0.3);
        box-shadow: 0 0 14px rgba(124, 255, 79, 0.4);
      }
      /* SELECT / RUN — small pills at top-center, the only way to reach these
         on touch-only devices once the stock gamepad is disabled. */
      .vc-sys {
        position: fixed;
        top: 10px;
        width: 88px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 13px "Share Tech Mono", monospace;
        color: #7cff4f;
        background: rgba(124, 255, 79, 0.08);
        border: 2px solid rgba(124, 255, 79, 0.5);
        border-radius: 16px;
        pointer-events: auto;
        touch-action: none;
        z-index: 62;
        -webkit-user-select: none;
        user-select: none;
      }
      body.show-controls .vc-sys {
        pointer-events: none;
      }
      .vc-sys.active {
        background: rgba(124, 255, 79, 0.35);
        border-color: #7cff4f;
      }
      #vc-select { left: 50%; margin-left: -94px; }
      #vc-start { left: 50%; margin-left: 6px; }
    </style>
  </head>
  <body>
    <div id="display"></div>
    <div id="vc-overlay" aria-hidden="true">
      <div id="vc-analog"></div>
      <div id="vc-b"><div class="vc-face">II</div></div>
      <div id="vc-a"><div class="vc-face">I</div></div>
      <div id="vc-select" class="vc-sys">SELECT</div>
      <div id="vc-start" class="vc-sys">RUN</div>
      <div id="vc-base"></div>
      <div id="vc-knob"></div>
    </div>
    <div id="err">
      No ROM specified. Pass <code>?rom=&lt;filename&gt;</code>.
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var rom = params.get("rom") || "";
        if (!rom) {
          document.getElementById("err").classList.add("show");
          return;
        }
        var romUrl = "/TurboGrafx-16/" + encodeURIComponent(rom);
        var title = rom.replace(/\.pce$/i, "");
        document.title = title || "TurboGrafx-16";

        if ("ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0) {
          document.body.classList.add("touch");
        }

        window.EJS_player = "#display";
        // Full Beetle PCE / Mednafen PCE libretro core (more accurate than pce_fast).
        window.EJS_core = "mednafen_pce";
        window.EJS_gameUrl = romUrl;
        window.EJS_gameName = title;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_color = "#7CFF4F";
        // Suppress EmulatorJS's stock on-screen gamepad — play.html draws a
        // custom dynamic analog + II/I overlay instead (see setupTouchController).
        window.EJS_VirtualGamepadSettings = [];

        function postParent(type) {
          try {
            window.parent.postMessage({ type: type }, "*");
          } catch (_) {}
        }

        // Attach a parent-notify listener to the "Exit Emulation" menu button.
        // EmulatorJS doesn't expose an exit() method, so we hook the DOM button.
        function hookExitButton() {
          var buttons = document.querySelectorAll(".ejs_menu_button");
          for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            var text = (b.textContent || "").trim();
            if (text === "Exit Emulation" && !b.dataset.tg16Hooked) {
              b.dataset.tg16Hooked = "1";
              b.addEventListener("click", function () {
                postParent("tg16-exit");
              });
              return true;
            }
          }
          return false;
        }
        window.EJS_ready = function () {
          if (hookExitButton()) return;
          // Button may render slightly after EJS_ready — observe until it appears.
          var mo = new MutationObserver(function () {
            if (hookExitButton()) mo.disconnect();
          });
          mo.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () {
            mo.disconnect();
          }, 15000);
        };

        // Parent controls EJS chrome visibility (gamepad combo / touch).
        window.addEventListener("message", function (e) {
          var d = e.data || {};
          if (d.type === "tg16-show-controls") {
            document.body.classList.add("show-controls");
          } else if (d.type === "tg16-hide-controls") {
            document.body.classList.remove("show-controls");
          }
        });

        // Keyboard fallback for revealing the control bar. The gamepad chord
        // (SELECT + Down) is the primary path, but it's useless when the Gamepad
        // API sees no pad — e.g. Flatpak Chrome launched via Steam. The ` / ~
        // key (Backquote, with or without Shift) and Escape act as that chord, toggling
        // the bar so the menu (incl. Exit) stays reachable by keyboard, mouse,
        // or touch. During play the iframe holds focus, so this listener — not
        // the parent's — is the one that fires; it notifies the parent, which
        // owns the visibility state and echoes tg16-show/hide-controls back.
        window.addEventListener("keydown", function (e) {
          if (
            e.code === "Backquote" || e.key === "`" || e.key === "~" ||
            e.keyCode === 192 || e.key === "Escape"
          ) {
            // Capture phase + stopImmediatePropagation so EmulatorJS (which
            // listens on document) never also acts on this key.
            e.preventDefault();
            e.stopImmediatePropagation();
            postParent("tg16-toggle-controls");
          }
        }, true);

        // First touch inside the game iframe tells the parent to drop its close
        // button + controller-legend overlay so they don't obscure play.
        var touchReported = false;
        function reportFirstTouch() {
          if (touchReported) return;
          touchReported = true;
          try {
            window.parent.postMessage(
              { type: "tg16-first-touch" },
              window.location.origin,
            );
          } catch (_) {}
          window.removeEventListener("touchstart", reportFirstTouch, true);
          window.removeEventListener("pointerdown", reportFirstTouch, true);
        }
        window.addEventListener("touchstart", reportFirstTouch, {
          capture: true,
          passive: true,
        });
        window.addEventListener("pointerdown", reportFirstTouch, {
          capture: true,
          passive: true,
        });

        // Nintendo Online SNES Controller (Vendor 057e Product 2017) reports its
        // D-pad on axes[9] as an 8-direction hat switch — a single value encoding
        // one of 8 directions plus neutral. EmulatorJS's EXTRA_STICK mappings only
        // check the sign of an axis, so Down/Left/Right all collide as "positive".
        //
        // Instead, wrap navigator.getGamepads to *decode* the hat and synthesize
        // proper DPAD_UP/DOWN/LEFT/RIGHT button presses at indices 12-15. With
        // those buttons in place, EmulatorJS's stock defaults just work and so do
        // diagonals.
        var SNES_RE = /SNES Controller|057e.{0,8}2017/i;

        function decodeHat(v) {
          var none = { up: false, down: false, left: false, right: false };
          if (typeof v !== "number" || v < -1.05 || v > 1.05) return none;
          // Standard 8-direction hat encoding: -1..1 mapped to 8 slots.
          //   -7/7 = Up, -5/7 = Up-Right, -3/7 = Right, -1/7 = Down-Right,
          //    1/7 = Down,  3/7 = Down-Left,  5/7 = Left,  7/7 = Up-Left.
          var pos = Math.round((v + 1) * 3.5); // 0..7
          var labels = [
            "up",
            "upright",
            "right",
            "downright",
            "down",
            "downleft",
            "left",
            "upleft",
          ];
          var d = labels[pos] || "";
          return {
            up: d === "up" || d === "upright" || d === "upleft",
            down: d === "down" || d === "downright" || d === "downleft",
            left: d === "left" || d === "downleft" || d === "upleft",
            right: d === "right" || d === "upright" || d === "downright",
          };
        }

        function mkBtn(pressed) {
          return { pressed: pressed, touched: pressed, value: pressed ? 1 : 0 };
        }

        function wrapSnesPad(p) {
          // Use a Proxy so EmulatorJS sees a fresh `buttons` array each frame with
          // synthesized D-pad entries at 12-15. All other properties pass through.
          return new Proxy(p, {
            get: function (t, prop) {
              if (prop === "buttons") {
                var dirs = decodeHat(t.axes[9]);
                var orig = t.buttons;
                var out = new Array(Math.max(orig.length, 16));
                for (var i = 0; i < out.length; i++) {
                  out[i] = orig[i] || mkBtn(false);
                }
                if (dirs.up) out[12] = mkBtn(true);
                if (dirs.down) out[13] = mkBtn(true);
                if (dirs.left) out[14] = mkBtn(true);
                if (dirs.right) out[15] = mkBtn(true);
                return out;
              }
              var v = t[prop];
              return typeof v === "function" ? v.bind(t) : v;
            },
          });
        }

        // The Gamepad API only exposes pads to the *focused* frame, and the
        // launcher's dashboard (the top frame) holds focus — so this iframe's
        // own navigator.getGamepads() is empty and EmulatorJS sees no
        // controller (its config panel greys out; nothing drives the game).
        // The dashboard, however, does see the pad. Since this iframe is
        // same-origin with it, read the parent frame's gamepads and hand them
        // to EmulatorJS, which then polls them natively (correct mapping,
        // working controller-config UI, analog sticks). Fall back to our own
        // frame's pads if the parent is unreachable or this frame has focus.
        var origGetGamepads = navigator.getGamepads.bind(navigator);
        function sourcePads() {
          try {
            var pp = window.parent;
            if (
              pp && pp !== window && pp.navigator && pp.navigator.getGamepads
            ) {
              var pg = pp.navigator.getGamepads() || [];
              for (var i = 0; i < pg.length; i++) {
                if (pg[i] && pg[i].connected) return pg;
              }
            }
          } catch (_) { /* cross-origin or unavailable — fall through */ }
          return origGetGamepads() || [];
        }
        navigator.getGamepads = function () {
          var pads = sourcePads();
          // Returning an Array is fine; EmulatorJS iterates by index + length.
          var out = [];
          for (var i = 0; i < pads.length; i++) {
            var p = pads[i];
            if (p && p.connected && SNES_RE.test(p.id || "")) {
              out.push(wrapSnesPad(p));
            } else out.push(p);
          }
          return out;
        };

        // Custom on-screen controller: a dynamic analog on the left half that
        // appears wherever the player touches (driving the TG16 D-pad), plus the
        // II and I face buttons each filling a 25% column on the right. Input is
        // fed to EmulatorJS via gameManager.simulateInput(player, index, value)
        // using RetroPad indices — for mednafen_pce, B=0 → Button II, A=8 →
        // Button I, UP=4, DOWN=5, LEFT=6, RIGHT=7.
        function setupTouchController() {
          var isTouch = "ontouchstart" in window ||
            (navigator.maxTouchPoints || 0) > 0;
          if (!isTouch) return;

          // RetroPad indices: for mednafen_pce, B=0 → II, A=8 → I,
          // SELECT=2 → SELECT, START=3 → RUN, plus the D-pad at 4-7.
          var IDX = {
            up: 4, down: 5, left: 6, right: 7,
            B: 0, A: 8, select: 2, start: 3,
          };

          function simulate(index, value) {
            try {
              var e = window.EJS_emulator;
              if (e && e.gameManager && e.gameManager.simulateInput) {
                e.gameManager.simulateInput(0, index, value);
              }
            } catch (_) {}
          }

          // ── Face / system buttons (II, I, SELECT, RUN) ───────────────
          // activeEl is the element that gets the pressed style (the .vc-face
          // cue for columns, or the pill itself for SELECT/RUN).
          function bindButton(el, index, activeEl) {
            activeEl = activeEl || el;
            var touchId = null;
            function press(id) {
              if (touchId !== null) return;
              touchId = id;
              activeEl.classList.add("active");
              simulate(index, 1);
            }
            function release() {
              if (touchId === null) return;
              touchId = null;
              activeEl.classList.remove("active");
              simulate(index, 0);
            }
            el.addEventListener("touchstart", function (e) {
              press(e.changedTouches[0].identifier);
              e.preventDefault();
            }, { passive: false });
            function endHandler(e) {
              for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                  release();
                  e.preventDefault();
                  return;
                }
              }
            }
            el.addEventListener("touchend", endHandler, { passive: false });
            el.addEventListener("touchcancel", endHandler, { passive: false });
          }
          var bEl = document.getElementById("vc-b");
          var aEl = document.getElementById("vc-a");
          bindButton(bEl, IDX.B, bEl.querySelector(".vc-face"));
          bindButton(aEl, IDX.A, aEl.querySelector(".vc-face"));
          bindButton(document.getElementById("vc-select"), IDX.select);
          bindButton(document.getElementById("vc-start"), IDX.start);

          // ── Dynamic analog → D-pad ───────────────────────────────────
          var zone = document.getElementById("vc-analog");
          var base = document.getElementById("vc-base");
          var knob = document.getElementById("vc-knob");
          var activeId = null, ox = 0, oy = 0;
          var DEAD = 22; // px of travel before any direction registers
          var RADIUS = 60; // knob travel limit (matches base radius)
          var dirs = { up: false, down: false, left: false, right: false };

          function setDir(name, on) {
            if (dirs[name] === on) return;
            dirs[name] = on;
            simulate(IDX[name], on ? 1 : 0);
          }
          function clearDirs() {
            setDir("up", false);
            setDir("down", false);
            setDir("left", false);
            setDir("right", false);
          }
          function showStick(x, y) {
            base.style.left = x + "px";
            base.style.top = y + "px";
            knob.style.left = x + "px";
            knob.style.top = y + "px";
            base.style.display = "block";
            knob.style.display = "block";
          }
          function hideStick() {
            base.style.display = "none";
            knob.style.display = "none";
          }
          function updateStick(x, y) {
            var dx = x - ox, dy = y - oy;
            var mag = Math.sqrt(dx * dx + dy * dy);
            // Clamp the knob to its travel radius for the visual.
            var kx = x, ky = y;
            if (mag > RADIUS) {
              kx = ox + dx / mag * RADIUS;
              ky = oy + dy / mag * RADIUS;
            }
            knob.style.left = kx + "px";
            knob.style.top = ky + "px";

            if (mag < DEAD) {
              clearDirs();
              return;
            }
            // 8-way octant decode. Screen y grows downward, so negate dy to get
            // a standard math angle (0°=right, 90°=up).
            var deg = Math.atan2(-dy, dx) * 180 / Math.PI;
            if (deg < 0) deg += 360;
            setDir("right", deg < 67.5 || deg >= 292.5);
            setDir("up", deg >= 22.5 && deg < 157.5);
            setDir("left", deg >= 112.5 && deg < 247.5);
            setDir("down", deg >= 202.5 && deg < 337.5);
          }
          zone.addEventListener("touchstart", function (e) {
            if (activeId !== null) return;
            var t = e.changedTouches[0];
            activeId = t.identifier;
            ox = t.clientX;
            oy = t.clientY;
            showStick(ox, oy);
            updateStick(t.clientX, t.clientY);
            e.preventDefault();
          }, { passive: false });
          zone.addEventListener("touchmove", function (e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
              var t = e.changedTouches[i];
              if (t.identifier === activeId) {
                updateStick(t.clientX, t.clientY);
                e.preventDefault();
                return;
              }
            }
          }, { passive: false });
          function analogEnd(e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
              if (e.changedTouches[i].identifier === activeId) {
                activeId = null;
                hideStick();
                clearDirs();
                e.preventDefault();
                return;
              }
            }
          }
          zone.addEventListener("touchend", analogEnd, { passive: false });
          zone.addEventListener("touchcancel", analogEnd, { passive: false });

          // Belt-and-suspenders: hide EmulatorJS's virtual gamepad if a build
          // ignores the empty EJS_VirtualGamepadSettings and renders one anyway.
          function killDefaultVGamepad() {
            try {
              var e = window.EJS_emulator;
              if (e && e.virtualGamepad) e.virtualGamepad.style.display = "none";
            } catch (_) {}
            var nodes = document.querySelectorAll(
              '[class*="vgamepad"], [class*="virtualGamepad"]',
            );
            for (var i = 0; i < nodes.length; i++) {
              nodes[i].style.display = "none";
            }
          }
          killDefaultVGamepad();
          var tries = 0;
          var timer = setInterval(function () {
            killDefaultVGamepad();
            if (++tries > 20) clearInterval(timer);
          }, 500);
        }
        setupTouchController();

        var s = document.createElement("script");
        s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
