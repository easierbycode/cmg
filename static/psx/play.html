<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PlayStation</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; color: #9CFF6B; font-family: 'Share Tech Mono', monospace; }
  #display { width: 100%; height: 100%; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 2em; }
  #err.show { display: flex; }
  /* Hide EmulatorJS chrome by default — parent toggles `.show-controls` to reveal */
  .ejs_menu_bar, .ejs_top_bar { opacity: 0 !important; pointer-events: none !important; transition: opacity .2s ease; }
  body.show-controls .ejs_menu_bar,
  body.show-controls .ejs_top_bar,
  body.touch .ejs_menu_bar,
  body.touch .ejs_top_bar { opacity: 1 !important; pointer-events: auto !important; }
  /* Hide cursor when a gamepad is connected */
  body.pad-on, body.pad-on * { cursor: none !important; }
</style>
</head>
<body>
<div id="display"></div>
<div id="err">No disc specified.</div>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var rom = params.get('rom') || '';
    var byod = params.get('byod') === '1';
    var gameUrl = '';
    var title = 'PlayStation';

    if (byod) {
      try {
        var raw = sessionStorage.getItem('psx-byod');
        if (!raw) throw new Error('No BYOD payload in sessionStorage');
        var payload = JSON.parse(raw);
        gameUrl = payload.gameUrl;
        title = payload.name || 'PlayStation';
        if (!gameUrl) throw new Error('BYOD payload missing gameUrl');
      } catch (e) {
        document.getElementById('err').textContent = 'BYOD failed: ' + e.message;
        document.getElementById('err').classList.add('show');
        return;
      }
    } else if (rom) {
      gameUrl = '/PlayStation/' + encodeURIComponent(rom);
      title = rom.replace(/\.(pbp|chd|iso|bin|cue|m3u)$/i, '');
    } else {
      document.getElementById('err').classList.add('show');
      return;
    }

    document.title = title;

    if ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0) {
      document.body.classList.add('touch');
    }

    // Cursor hide on gamepad connect
    function refreshPadClass() {
      var pads = (navigator.getGamepads && navigator.getGamepads()) || [];
      var any = false;
      for (var i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) { any = true; break; }
      document.body.classList.toggle('pad-on', any);
    }
    window.addEventListener('gamepadconnected', refreshPadClass);
    window.addEventListener('gamepaddisconnected', refreshPadClass);
    refreshPadClass();

    window.EJS_player = '#display';
    // pcsx_rearmed has the best speed/compat trade-off for PSX in browser.
    window.EJS_core = 'psx';
    window.EJS_gameUrl = gameUrl;
    window.EJS_gameName = title;
    // US BIOS by default — handles most NTSC discs. (JP=5500, EU=5502.)
    window.EJS_biosUrl = '/bios/scph5501.bin';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#7CFF4F';

    function postParent(type) {
      try { window.parent.postMessage({ type: type }, '*'); } catch (_) {}
    }

    function hookExitButton() {
      var buttons = document.querySelectorAll('.ejs_menu_button');
      for (var i = 0; i < buttons.length; i++) {
        var b = buttons[i];
        var text = (b.textContent || '').trim();
        if (text === 'Exit Emulation' && !b.dataset.psxHooked) {
          b.dataset.psxHooked = '1';
          b.addEventListener('click', function () { postParent('tg16-exit'); });
          return true;
        }
      }
      return false;
    }
    window.EJS_ready = function () {
      if (hookExitButton()) return;
      var mo = new MutationObserver(function () {
        if (hookExitButton()) mo.disconnect();
      });
      mo.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { mo.disconnect(); }, 15000);
    };

    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type === 'tg16-show-controls') document.body.classList.add('show-controls');
      else if (d.type === 'tg16-hide-controls') document.body.classList.remove('show-controls');
    });

    // SNES adapter hat-axis decode (mirrors TG-16 page) — synthesizes proper
    // DPAD button presses at indices 12-15 so EmulatorJS's stock mapping works.
    var SNES_RE = /SNES Controller|057e.{0,8}2017/i;
    function decodeHat(v) {
      var none = { up: false, down: false, left: false, right: false };
      if (typeof v !== 'number' || v < -1.05 || v > 1.05) return none;
      var pos = Math.round((v + 1) * 3.5);
      var labels = ['up','upright','right','downright','down','downleft','left','upleft'];
      var d = labels[pos] || '';
      return {
        up:    d === 'up'    || d === 'upright'    || d === 'upleft',
        down:  d === 'down'  || d === 'downright'  || d === 'downleft',
        left:  d === 'left'  || d === 'downleft'   || d === 'upleft',
        right: d === 'right' || d === 'upright'    || d === 'downright',
      };
    }
    function mkBtn(pressed) { return { pressed: pressed, touched: pressed, value: pressed ? 1 : 0 }; }
    function wrapSnesPad(p) {
      return new Proxy(p, {
        get: function (t, prop) {
          if (prop === 'buttons') {
            var dirs = decodeHat(t.axes[9]);
            var orig = t.buttons;
            var out = new Array(Math.max(orig.length, 16));
            for (var i = 0; i < out.length; i++) out[i] = orig[i] || mkBtn(false);
            if (dirs.up)    out[12] = mkBtn(true);
            if (dirs.down)  out[13] = mkBtn(true);
            if (dirs.left)  out[14] = mkBtn(true);
            if (dirs.right) out[15] = mkBtn(true);
            return out;
          }
          var v = t[prop];
          return typeof v === 'function' ? v.bind(t) : v;
        }
      });
    }
    var origGetGamepads = navigator.getGamepads.bind(navigator);
    navigator.getGamepads = function () {
      var pads = origGetGamepads() || [];
      var out = [];
      for (var i = 0; i < pads.length; i++) {
        var p = pads[i];
        if (p && p.connected && SNES_RE.test(p.id || '')) out.push(wrapSnesPad(p));
        else out.push(p);
      }
      return out;
    };

    var s = document.createElement('script');
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
