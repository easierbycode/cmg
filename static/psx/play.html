<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PlayStation</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #9cff6b;
        font-family: "Share Tech Mono", monospace;
      }
      #display {
        width: 100%;
        height: 100%;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      #err.show {
        display: flex;
      }
      /* Hide EmulatorJS chrome by default — parent toggles `.show-controls` to reveal */
      .ejs_menu_bar, .ejs_top_bar {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.2s ease;
      }
      body.show-controls .ejs_menu_bar,
      body.show-controls .ejs_top_bar,
      body.touch .ejs_menu_bar,
      body.touch .ejs_top_bar {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      /* Hide cursor when a gamepad is connected */
      body.pad-on, body.pad-on * {
        cursor: none !important;
      }
    </style>
  </head>
  <body>
    <div id="display"></div>
    <div id="err">No disc specified.</div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var rom = params.get("rom") || "";
        var byod = params.get("byod") === "1";

        if (!byod && !rom) {
          document.getElementById("err").classList.add("show");
          return;
        }

        if ("ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0) {
          document.body.classList.add("touch");
        }

        // Cursor hide on gamepad connect
        function refreshPadClass() {
          var pads = (navigator.getGamepads && navigator.getGamepads()) || [];
          var any = false;
          for (var i = 0; i < pads.length; i++) {
            if (pads[i] && pads[i].connected) {
              any = true;
              break;
            }
          }
          document.body.classList.toggle("pad-on", any);
        }
        window.addEventListener("gamepadconnected", refreshPadClass);
        window.addEventListener("gamepaddisconnected", refreshPadClass);
        refreshPadClass();

        // SNES adapter hat-axis decode — synthesise DPAD presses at indices 12-15
        // so EmulatorJS's stock mapping works for SNES → USB controllers.
        var SNES_RE = /SNES Controller|057e.{0,8}2017/i;
        function decodeHat(v) {
          var none = { up: false, down: false, left: false, right: false };
          if (typeof v !== "number" || v < -1.05 || v > 1.05) return none;
          var pos = Math.round((v + 1) * 3.5);
          var labels = [
            "up",
            "upright",
            "right",
            "downright",
            "down",
            "downleft",
            "left",
            "upleft",
          ];
          var d = labels[pos] || "";
          return {
            up: d === "up" || d === "upright" || d === "upleft",
            down: d === "down" || d === "downright" || d === "downleft",
            left: d === "left" || d === "downleft" || d === "upleft",
            right: d === "right" || d === "upright" || d === "downright",
          };
        }
        function mkBtn(pressed) {
          return { pressed: pressed, touched: pressed, value: pressed ? 1 : 0 };
        }
        function wrapSnesPad(p) {
          return new Proxy(p, {
            get: function (t, prop) {
              if (prop === "buttons") {
                var dirs = decodeHat(t.axes[9]);
                var orig = t.buttons;
                var out = new Array(Math.max(orig.length, 16));
                for (var i = 0; i < out.length; i++) {
                  out[i] = orig[i] || mkBtn(false);
                }
                if (dirs.up) out[12] = mkBtn(true);
                if (dirs.down) out[13] = mkBtn(true);
                if (dirs.left) out[14] = mkBtn(true);
                if (dirs.right) out[15] = mkBtn(true);
                return out;
              }
              var v = t[prop];
              return typeof v === "function" ? v.bind(t) : v;
            },
          });
        }
        // The Gamepad API only exposes pads to the *focused* frame, and the
        // launcher's dashboard (the top frame) holds focus — so this iframe's
        // own navigator.getGamepads() is empty and EmulatorJS sees no
        // controller (its config panel greys out; nothing drives the game).
        // The dashboard does see the pad, and this iframe is same-origin with
        // it, so read the parent frame's gamepads and hand them to EmulatorJS,
        // which polls them natively. Fall back to our own frame's pads if the
        // parent is unreachable or this frame has focus.
        var origGetGamepads = navigator.getGamepads.bind(navigator);
        function sourcePads() {
          try {
            var pp = window.parent;
            if (
              pp && pp !== window && pp.navigator && pp.navigator.getGamepads
            ) {
              var pg = pp.navigator.getGamepads() || [];
              for (var i = 0; i < pg.length; i++) {
                if (pg[i] && pg[i].connected) return pg;
              }
            }
          } catch (_) { /* cross-origin or unavailable — fall through */ }
          return origGetGamepads() || [];
        }
        navigator.getGamepads = function () {
          var pads = sourcePads();
          var out = [];
          for (var i = 0; i < pads.length; i++) {
            var p = pads[i];
            if (p && p.connected && SNES_RE.test(p.id || "")) {
              out.push(wrapSnesPad(p));
            } else out.push(p);
          }
          return out;
        };

        // Only accept control / file messages from our own parent (same-origin).
        function isFromOwnParent(e) {
          if (e.origin && e.origin !== window.location.origin) return false;
          return e.source === window.parent;
        }
        window.addEventListener("message", function (e) {
          if (!isFromOwnParent(e)) return;
          var d = e.data || {};
          if (d.type === "tg16-show-controls") {
            document.body.classList.add("show-controls");
          } else if (d.type === "tg16-hide-controls") {
            document.body.classList.remove("show-controls");
          }
        });

        function postParent(type) {
          try {
            window.parent.postMessage({ type: type }, window.location.origin);
          } catch (_) {}
        }

        // Keyboard fallback for the control bar — see turbografx16/play.html. The
        // ` / ~ key (Backquote, with or without Shift) mirrors the SELECT + Down
        // gamepad chord, so the emulator menu (incl. Exit) is reachable when the
        // Gamepad API sees no pad (e.g. Flatpak Chrome under Steam). The iframe
        // holds focus during play, so this fires; the parent owns the toggle state.
        window.addEventListener("keydown", function (e) {
          if (
            e.code === "Backquote" || e.key === "`" || e.key === "~" ||
            e.keyCode === 192
          ) {
            // Capture phase + stopImmediatePropagation so EmulatorJS (which
            // listens on document) never also acts on this key.
            e.preventDefault();
            e.stopImmediatePropagation();
            postParent("tg16-toggle-controls");
          }
        }, true);

        // First touch inside the game iframe tells the parent to drop its close
        // button + controller-legend overlay so they don't obscure play.
        var touchReported = false;
        function reportFirstTouch() {
          if (touchReported) return;
          touchReported = true;
          postParent("tg16-first-touch");
          window.removeEventListener("touchstart", reportFirstTouch, true);
          window.removeEventListener("pointerdown", reportFirstTouch, true);
        }
        window.addEventListener("touchstart", reportFirstTouch, {
          capture: true,
          passive: true,
        });
        window.addEventListener("pointerdown", reportFirstTouch, {
          capture: true,
          passive: true,
        });

        function hookExitButton() {
          var buttons = document.querySelectorAll(".ejs_menu_button");
          for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            var text = (b.textContent || "").trim();
            if (text === "Exit Emulation" && !b.dataset.psxHooked) {
              b.dataset.psxHooked = "1";
              b.addEventListener("click", function () {
                postParent("tg16-exit");
              });
              return true;
            }
          }
          return false;
        }

        function boot(gameUrl, title) {
          document.title = title;
          window.EJS_player = "#display";
          window.EJS_core = "psx";
          window.EJS_gameUrl = gameUrl;
          window.EJS_gameName = title;
          // US BIOS by default — handles most NTSC discs. (JP=5500, EU=5502.)
          window.EJS_biosUrl = "/bios/scph5501.bin";
          window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
          window.EJS_startOnLoaded = true;
          window.EJS_color = "#7CFF4F";
          window.EJS_ready = function () {
            if (hookExitButton()) return;
            var mo = new MutationObserver(function () {
              if (hookExitButton()) mo.disconnect();
            });
            mo.observe(document.body, { childList: true, subtree: true });
            setTimeout(function () {
              mo.disconnect();
            }, 15000);
          };
          var s = document.createElement("script");
          s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
          document.body.appendChild(s);
        }

        if (byod) {
          // BYOD: parent (Dashboard) sends the disc File via postMessage so
          // EmulatorJS sees a File in *this* realm. (A parent-realm File would
          // fail EmulatorJS's `instanceof File` check.) We boot only after the
          // file arrives — and we only accept the message from our own parent.
          var booted = false;
          window.addEventListener("message", function (ev) {
            if (booted) return;
            if (!isFromOwnParent(ev)) return;
            if (!ev.data || ev.data.type !== "psx-byod-file") return;
            if (!ev.data.file) return;
            booted = true;
            var t = ev.data.name || ev.data.file.name.replace(/\.[^.]+$/, "");
            boot(ev.data.file, t);
          });
          try {
            window.parent.postMessage(
              { type: "psx-byod-ready" },
              window.location.origin,
            );
          } catch (_) {}
          setTimeout(function () {
            if (booted) return;
            document.getElementById("err").textContent =
              "BYOD failed: parent did not deliver disc file (10s).";
            document.getElementById("err").classList.add("show");
          }, 10000);
        } else {
          var url = "/PlayStation/" + encodeURIComponent(rom);
          var t = rom.replace(/\.(pbp|chd|iso|bin|cue|m3u)$/i, "");
          boot(url, t);
        }
      })();
    </script>
  </body>
</html>
