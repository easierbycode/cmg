# Keep the PlayStation 2 screen's Mario entries in step with
# easierbycode/ps2-mario.
#
# Both rows come from the same upstream commit: the browser build lands in
# static/games/ps2-mario/ (mounted at /games/ps2-mario/, listed via
# data/ps2-web.json) and the bootable disc image in
# static/PlayStation2/ps2-mario.iso, which scripts/build-ps2-manifest.ts
# indexes on every site build.
#
# Fires three ways:
#   repository_dispatch  ps2-mario's deploy workflow pokes us on every push
#                        to its main (needs its CMG_DISPATCH_TOKEN secret)
#   schedule             hourly safety net, so a missing token only ever
#                        costs latency
#   workflow_dispatch    manual re-sync
#
# A run that finds the vendored build already at the upstream commit stops
# before doing any work, so the hourly poll is nearly free and never
# produces an empty commit.
name: Sync ps2-mario

on:
  repository_dispatch:
    types: [ps2-mario-updated]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the vendored copy is already current"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-ps2-mario
  cancel-in-progress: false

env:
  UPSTREAM: easierbycode/ps2-mario
  MOUNT: /games/ps2-mario/

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve upstream commit
        id: upstream
        run: |
          sha=$(git ls-remote "https://github.com/$UPSTREAM" refs/heads/main | cut -f1)
          if [ -z "$sha" ]; then
            echo "could not resolve $UPSTREAM main" >&2
            exit 1
          fi
          have=$(sed -n 's/^source: .*@//p' static/games/ps2-mario/VERSION 2>/dev/null || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$have" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "already at $sha — nothing to do"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "vendored $have -> upstream $sha"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ps2-mario
        if: steps.upstream.outputs.stale == 'true'
        uses: actions/checkout@v5
        with:
          repository: easierbycode/ps2-mario
          ref: ${{ steps.upstream.outputs.sha }}
          path: .upstream

      - uses: actions/setup-node@v4
        if: steps.upstream.outputs.stale == 'true'
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        if: steps.upstream.outputs.stale == 'true'
        with:
          deno-version: v2.x

      - name: Build the browser bundle and the disc image
        if: steps.upstream.outputs.stale == 'true'
        working-directory: .upstream
        env:
          BASE_PATH: /games/ps2-mario/
        run: |
          npm install --no-audit --no-fund
          npm run build
          # Pin the ISO's timestamps to the source commit. Without this the
          # image is byte-different on every build, so each sync would land a
          # fresh 5.6MB blob in this repo's history even when the game itself
          # never changed.
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) \
            deno run --allow-read --allow-write --allow-env \
              scripts/build-athena-iso.ts ps2 dist/ps2-mario.iso

      - name: Vendor the results
        if: steps.upstream.outputs.stale == 'true'
        run: |
          rm -rf static/games/ps2-mario
          mkdir -p static/games/ps2-mario
          cp -r .upstream/dist/play .upstream/dist/assets static/games/ps2-mario/
          cp .upstream/dist/ps2-mario.iso static/PlayStation2/ps2-mario.iso
          {
            echo "source: $UPSTREAM@${{ steps.upstream.outputs.sha }}"
            echo "built with: BASE_PATH=$MOUNT npm run build"
            echo "copied: dist/play + dist/assets"
          } > static/games/ps2-mario/VERSION
          deno run -A scripts/build-ps2-manifest.ts
          rm -rf .upstream

      - name: Commit
        if: steps.upstream.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/games/ps2-mario static/PlayStation2/ps2-mario.iso static/PlayStation2/manifest.json
          if git diff --cached --quiet; then
            echo "upstream moved but the build is byte-identical — nothing to commit"
            exit 0
          fi
          git commit -m "Sync ps2-mario @ ${{ steps.upstream.outputs.sha }}"
          # main can move while a build runs; rebase onto it rather than fail
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1
