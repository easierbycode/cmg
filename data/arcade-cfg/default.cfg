<?xml version="1.0"?>
<!--
  MAME default.cfg — the baseline control map for EVERY arcade game. MAME reads
  this first and then layers the per-driver cfg (sfex2.cfg, …) on top, so any
  port a game cfg does not name falls back to what is here. Put anything that
  should hold across the whole arcade library in this file; put game-specific
  button layouts in data/arcade-cfg/<driver>.cfg.

  Joystick button numbering: the emularity MAME core (MAME 0.239, SDL raw
  joystick provider) sees the browser Gamepad API's standard layout, and its
  cfg token is the gamepad index PLUS ONE — JOYCODE_1_BUTTON13 is gamepad index
  12. (MAME's own Input menu displays the 0-based index, so that token reads
  back as "Joy 1 button 12". Confirmed against a live pad.) Hence:

    index 0-3   face bottom/right/left/top   -> BUTTON1..BUTTON4
    index 4-7   L1 / R1 / L2 / R2            -> BUTTON5..BUTTON8
    index 8/9   Share-Select / Start         -> BUTTON9 / BUTTON10
    index 10/11 L3 / R3                      -> BUTTON11 / BUTTON12
    index 12-15 D-pad up/down/left/right     -> BUTTON13..BUTTON16

  The D-pad arrives as BUTTONS, not a hat: the browser reports no hats for a
  standard-mapping pad (MAME logs "0 hats"), so JOYCODE_1_HAT1* never fires and
  the stock defaults left the D-pad dead — only the left analog stick moved the
  player. Each direction below therefore keeps its keyboard key and the analog
  axis switch, and appends the matching D-pad button.

  Player 2 stays on the keyboard: the arcade player installs
  CMGGamepadCompat with preferSinglePad, so exactly one pad is ever exposed to
  MAME and JOYCODE_2_* could never fire.
-->
<mameconfig version="10">
    <system name="default">
        <input>
            <!-- Player 1 directions: keyboard, left analog stick, D-pad -->
            <port type="P1_JOYSTICK_UP">
                <newseq type="standard">KEYCODE_UP OR JOYCODE_1_YAXIS_UP_SWITCH OR JOYCODE_1_BUTTON13</newseq>
            </port>
            <port type="P1_JOYSTICK_DOWN">
                <newseq type="standard">KEYCODE_DOWN OR JOYCODE_1_YAXIS_DOWN_SWITCH OR JOYCODE_1_BUTTON14</newseq>
            </port>
            <port type="P1_JOYSTICK_LEFT">
                <newseq type="standard">KEYCODE_LEFT OR JOYCODE_1_XAXIS_LEFT_SWITCH OR JOYCODE_1_BUTTON15</newseq>
            </port>
            <port type="P1_JOYSTICK_RIGHT">
                <newseq type="standard">KEYCODE_RIGHT OR JOYCODE_1_XAXIS_RIGHT_SWITCH OR JOYCODE_1_BUTTON16</newseq>
            </port>

            <!-- MAME's own menus (the Tab menu, the save/load state slot list)
                 navigate with the D-pad too, so a pad-only player can drive
                 them. UI_SELECT already accepts face-bottom by default.

                 Deliberately NOT bound to the pad: UI_CANCEL. It doubles as
                 "quit MAME" whenever no menu is open, so putting it on a face
                 button would end the game mid-match (face-right is Medium Kick
                 in sfex2). -->
            <port type="UI_UP">
                <newseq type="standard">KEYCODE_UP OR JOYCODE_1_YAXIS_UP_SWITCH OR JOYCODE_1_BUTTON13</newseq>
            </port>
            <port type="UI_DOWN">
                <newseq type="standard">KEYCODE_DOWN OR JOYCODE_1_YAXIS_DOWN_SWITCH OR JOYCODE_1_BUTTON14</newseq>
            </port>
            <port type="UI_LEFT">
                <newseq type="standard">KEYCODE_LEFT OR JOYCODE_1_XAXIS_LEFT_SWITCH OR JOYCODE_1_BUTTON15</newseq>
            </port>
            <port type="UI_RIGHT">
                <newseq type="standard">KEYCODE_RIGHT OR JOYCODE_1_XAXIS_RIGHT_SWITCH OR JOYCODE_1_BUTTON16</newseq>
            </port>
        </input>
    </system>
</mameconfig>
