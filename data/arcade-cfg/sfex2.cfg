<?xml version="1.0"?>
<!--
  Street Fighter EX2 (sfex2) - Capcom ZN / cpzn2 board, MAME driver "sfex2",
  6-button INPUT_PORTS layout "zn6b" (see MAME src/mame/drivers/zn.cpp).

  Committed control map for the CMG Network arcade player (Stadia Controller).
  The browser Gamepad API exposes the Stadia pad as a standard-layout joystick,
  and the emularity MAME core (MAME 0.239, SDL raw-joystick provider) sees it as
  Joystick 1 with buttons numbered by Gamepad-API index + 1:

    JOYCODE_1_BUTTON1  = A   (face bottom)   JOYCODE_1_BUTTON6  = R1
    JOYCODE_1_BUTTON2  = B   (face right)    JOYCODE_1_BUTTON8  = R2
    JOYCODE_1_BUTTON3  = X   (face left)     JOYCODE_1_BUTTON10 = Start (menu)
    JOYCODE_1_BUTTON4  = Y   (face top)      JOYCODE_1_BUTTON11 = L3 (stick click)

  Requested layout (punch row on top, kick row on bottom):
    Button 1 (LP) = face_left  (X)     Button 4 (LK) = face_bottom (A)
    Button 2 (MP) = face_top   (Y)     Button 5 (MK) = face_right  (B)
    Button 3 (HP) = R1                 Button 6 (HK) = R2
    START = Start button
    L3    = Service Mode (opens the operator test menu to turn Free Play ON)

  Directions stay on the MAME defaults (left analog stick). Keyboard defaults
  are kept alongside each control so the player and keyboard both work.
-->
<mameconfig version="10">
    <system name="sfex2">
        <input>
            <!-- Punch row (top): LP MP HP  ->  face_left, face_top, R1 -->
            <port tag=":P1" type="P1_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">KEYCODE_LCONTROL OR JOYCODE_1_BUTTON3</newseq>
            </port>
            <port tag=":P1" type="P1_BUTTON2" mask="32" defvalue="32">
                <newseq type="standard">KEYCODE_LALT OR JOYCODE_1_BUTTON4</newseq>
            </port>
            <port tag=":P1" type="P1_BUTTON3" mask="64" defvalue="64">
                <newseq type="standard">KEYCODE_SPACE OR JOYCODE_1_BUTTON6</newseq>
            </port>
            <!-- Kick row (bottom): LK MK HK  ->  face_bottom, face_right, R2 -->
            <port tag=":P3" type="P1_BUTTON4" mask="16" defvalue="16">
                <newseq type="standard">KEYCODE_LSHIFT OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <port tag=":P3" type="P1_BUTTON5" mask="32" defvalue="32">
                <newseq type="standard">KEYCODE_Z OR JOYCODE_1_BUTTON2</newseq>
            </port>
            <port tag=":P3" type="P1_BUTTON6" mask="64" defvalue="64">
                <newseq type="standard">KEYCODE_X OR JOYCODE_1_BUTTON8</newseq>
            </port>
            <!-- START button starts the game (once a credit/Free Play is set) -->
            <port tag=":SYSTEM" type="START1" mask="1" defvalue="1">
                <newseq type="standard">KEYCODE_1 OR JOYCODE_1_BUTTON10</newseq>
            </port>
            <!-- L3 = Service Mode: opens the operator test menu to toggle Free Play -->
            <port tag=":SERVICE" type="SERVICE" mask="1" defvalue="1">
                <newseq type="standard">KEYCODE_F2 OR JOYCODE_1_BUTTON11</newseq>
            </port>
        </input>
    </system>
</mameconfig>
