<?xml version="1.0"?>
<!--
  Street Fighter EX2 (sfex2) - Capcom ZN / cpzn2 board, MAME driver "sfex2",
  6-button INPUT_PORTS layout "zn6b" (see MAME src/mame/drivers/zn.cpp).

  Committed control map for the CMG Network arcade player. The browser Gamepad
  API exposes a standard-layout joystick, and the emularity MAME core (MAME
  0.239, SDL raw-joystick provider) sees it as Joystick 1 with buttons numbered
  by Gamepad-API index + 1 (full table in default.cfg):

    JOYCODE_1_BUTTON1  = face bottom   JOYCODE_1_BUTTON6  = R1
    JOYCODE_1_BUTTON2  = face right    JOYCODE_1_BUTTON8  = R2
    JOYCODE_1_BUTTON3  = face left     JOYCODE_1_BUTTON10 = Start (menu)
    JOYCODE_1_BUTTON4  = face top

  Target layout — the standard six-button fighter arrangement, punch row on
  top, kick row on bottom:

    LP = face_left    MP = face_top     HP = R1
    LK = face_bottom  MK = face_right   HK = R2

  IMPORTANT — MAME's P1_BUTTONn ports for this driver are NOT in LP/MP/HP,
  LK/MK/HK order. An earlier version of this file assumed they were, and the
  result was a scrambled layout in game: with P1_BUTTON1 bound to face_left,
  the button that actually threw a Hard Punch was face_left, not Light Punch.
  Mapping each port by what it does in game rather than by its number gives:

    P1_BUTTON1 = HP   P1_BUTTON2 = LK   P1_BUTTON3 = HK
    P1_BUTTON4 = LP   P1_BUTTON5 = MP   P1_BUTTON6 = MK

  so each port below is bound to the joycode for ITS action's target button.
  Change a binding by finding the action in that table first — going by the
  port number alone is what produced the original scramble.

  Keyboard keys are left on MAME's stock per-button defaults and are
  deliberately not reshuffled to match the action order.

  Service Mode (the operator test menu) is KEYBOARD ONLY — F2. It used to sit
  on L3, but a stick click is far too easy to hit while walking or throwing a
  move with the analog stick, and it drops the player into the operator menu
  mid-match. Free Play already ships baked into the board's EEPROM
  (static/arcade/nvram/sfex2/at28c16), so nobody needs the menu to play.

  Directions come from data/arcade-cfg/default.cfg (keyboard + left analog
  stick + D-pad) — this file deliberately does not name them. Keyboard
  defaults are kept alongside each button so the player and keyboard both work.
-->
<mameconfig version="10">
    <system name="sfex2">
        <input>
            <!-- P1_BUTTON1 = HP  ->  R1 -->
            <port tag=":P1" type="P1_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">KEYCODE_LCONTROL OR JOYCODE_1_BUTTON6</newseq>
            </port>
            <!-- P1_BUTTON2 = LK  ->  face_bottom -->
            <port tag=":P1" type="P1_BUTTON2" mask="32" defvalue="32">
                <newseq type="standard">KEYCODE_LALT OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <!-- P1_BUTTON3 = HK  ->  R2 -->
            <port tag=":P1" type="P1_BUTTON3" mask="64" defvalue="64">
                <newseq type="standard">KEYCODE_SPACE OR JOYCODE_1_BUTTON8</newseq>
            </port>
            <!-- P1_BUTTON4 = LP  ->  face_left -->
            <port tag=":P3" type="P1_BUTTON4" mask="16" defvalue="16">
                <newseq type="standard">KEYCODE_LSHIFT OR JOYCODE_1_BUTTON3</newseq>
            </port>
            <!-- P1_BUTTON5 = MP  ->  face_top -->
            <port tag=":P3" type="P1_BUTTON5" mask="32" defvalue="32">
                <newseq type="standard">KEYCODE_Z OR JOYCODE_1_BUTTON4</newseq>
            </port>
            <!-- P1_BUTTON6 = MK  ->  face_right -->
            <port tag=":P3" type="P1_BUTTON6" mask="64" defvalue="64">
                <newseq type="standard">KEYCODE_X OR JOYCODE_1_BUTTON2</newseq>
            </port>
            <!-- START button starts the game (once a credit/Free Play is set).
                 The joycode alone is not enough on SNES-class pads: the SDL
                 joystick layer registers the pad with its RAW button count
                 (8 on the joydev family), so the compat plugin's normalized
                 Start slot (button 10 here) is past the end and never fires.
                 play.html therefore also mirrors pad Start into KEYCODE_1,
                 and fires KEYCODE_5 (COIN1's stock binding) on a clean
                 Select tap — INSERT COIN for boards not on Free Play. -->
            <port tag=":SYSTEM" type="START1" mask="1" defvalue="1">
                <newseq type="standard">KEYCODE_1 OR JOYCODE_1_BUTTON10</newseq>
            </port>
            <!-- Service Mode: keyboard only, see the header. JOYCODE_1_BUTTON11
                 (L3) is intentionally absent. -->
            <port tag=":SERVICE" type="SERVICE" mask="1" defvalue="1">
                <newseq type="standard">KEYCODE_F2</newseq>
            </port>
        </input>
    </system>
</mameconfig>
